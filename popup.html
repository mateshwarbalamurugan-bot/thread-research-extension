<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THREAD</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="eyebrow">VISUAL EVIDENCE MAPPING</div>
    <h1>THREAD</h1>
    <p>Collect evidence. Connect ideas.</p>
  </header>
  <main>
    <div class="section-heading">
      <h2>Saved findings</h2>
      <span id="count">0</span>
    </div>
    <p id="empty" class="empty">No findings yet. Select text on a webpage, right-click, and choose “Save selection to THREAD”.</p>
    <ul id="findings" aria-live="polite"></ul>
    <button id="clear" class="clear-button" type="button">Clear all findings</button>
  </main>
</body>
</html>
